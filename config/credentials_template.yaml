# Athena Trading System — Instance Credentials Template
# Copy this file to credentials_<instance_name>.yaml and fill in your Alpaca keys
#
# Create a free Alpaca paper trading account at: https://alpaca.markets/
# Each Athena instance needs its own paper trading account.

alpaca:
  api_key: YOUR_ALPACA_API_KEY_HERE
  secret_key: YOUR_ALPACA_SECRET_KEY_HERE
  paper: true
