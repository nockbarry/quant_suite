{% if context.summary %}
<div class="bg-gray-900 border border-blue-900/30 rounded-lg p-4">
    <h2 class="text-sm font-semibold text-blue-400 mb-2">Decision Context: {{ symbol }}</h2>
    <pre class="text-xs text-gray-300 mono whitespace-pre-wrap leading-relaxed">{{ summary_text }}</pre>
</div>
{% else %}
<div class="bg-gray-900 border border-gray-800 rounded-lg p-4">
    <p class="text-sm text-gray-600">No decision context available for {{ symbol }}.</p>
</div>
{% endif %}
